name: build-ipa
on: [workflow_dispatch, push]
jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project Asystent.xcodeproj -scheme Asystent -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - run: mkdir Payload && cp -R build/Build/Products/Release-iphoneos/Asystent.app Payload/ && zip -qr Asystent.ipa Payload
      - uses: actions/upload-artifact@v4
        with: {name: Asystent-ipa, path: Asystent.ipa}
